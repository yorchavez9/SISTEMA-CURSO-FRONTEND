name: Verificación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Tipos
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Compilación de producción
        run: npm run build
